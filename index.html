<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#0f172a" />

  <title>ASM Entry Check</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI",
        "Noto Sans KR", Arial, sans-serif;
      background: #f6f7f9;
      color: #111827;
    }

    button {
      font-family: inherit;
    }

    .top {
      background: #0f172a;
      color: white;
      padding: 22px 18px;
    }

    .top-inner {
      max-width: 650px;
      margin: auto;
    }

    .small-title {
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 1.5px;
      color: #94a3b8;
    }

    h1 {
      margin: 5px 0 4px;
      font-size: 27px;
      letter-spacing: -1px;
    }

    .sub {
      color: #cbd5e1;
      font-size: 14px;
    }

    .clock-box {
      margin-top: 17px;
      padding: 13px 14px;
      border-radius: 12px;
      background: rgba(255,255,255,0.08);
      border: 1px solid rgba(255,255,255,0.12);
    }

    .clock-label {
      color: #94a3b8;
      font-size: 11px;
      margin-bottom: 3px;
    }

    #clock {
      font-size: 18px;
      font-weight: 800;
      font-variant-numeric: tabular-nums;
    }

    .container {
      max-width: 650px;
      margin: auto;
      padding: 15px;
    }

    .card {
      background: #fff;
      border: 1px solid #e5e7eb;
      border-radius: 16px;
      padding: 18px;
      margin-bottom: 13px;
      box-shadow: 0 2px 10px rgba(0,0,0,.04);
    }

    .card-title {
      display: flex;
      align-items: center;
      gap: 9px;
      font-weight: 800;
      font-size: 17px;
      margin-bottom: 14px;
    }

    .num {
      width: 27px;
      height: 27px;
      border-radius: 8px;
      background: #0f172a;
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 11px;
      font-weight: 800;
    }

    .description {
      margin: -5px 0 14px 36px;
      color: #6b7280;
      font-size: 13px;
    }

    /* 지역 */

    .region-list {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 9px;
    }

    .region {
      height: 48px;
      border: 1px solid #d1d5db;
      border-radius: 11px;
      background: white;
      color: #374151;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
    }

    .region.active {
      background: #0f172a;
      border-color: #0f172a;
      color: white;
    }

    /* 이름 */

    .toolbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 11px;
    }

    .counter {
      font-size: 13px;
      color: #6b7280;
    }

    .counter strong {
      color: #111827;
    }

    .clear {
      border: 0;
      border-radius: 8px;
      padding: 8px 11px;
      background: #f1f3f5;
      color: #4b5563;
      font-weight: 700;
      font-size: 12px;
      cursor: pointer;
    }

    .people {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
    }

    .person {
      min-height: 44px;
      border: 1px solid #e0e3e7;
      background: #f8fafc;
      border-radius: 10px;
      color: #374151;
      font-size: 14px;
      font-weight: 650;
      cursor: pointer;
      position: relative;
    }

    .person.selected {
      background: #e5e7eb;
      color: #111827;
      border: 2px solid #111827;
    }

    .person.selected::after {
      content: "✓";
      position: absolute;
      top: 2px;
      right: 5px;
      font-size: 10px;
      font-weight: 900;
    }

    /* 메시지 */

    .preview {
      min-height: 130px;
      padding: 16px;
      background: #f8f9fb;
      border: 1px solid #e1e4e8;
      border-radius: 12px;
      color: #374151;
      white-space: pre-wrap;
      line-height: 1.65;
      font-size: 15px;
    }

    .preview.placeholder {
      color: #9ca3af;
    }

    .actions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 9px;
      margin-top: 12px;
    }

    .generate,
    .copy {
      height: 48px;
      border: none;
      border-radius: 11px;
      font-size: 15px;
      font-weight: 800;
      cursor: pointer;
    }

    .generate {
      background: #0f172a;
      color: white;
    }

    .copy {
      background: #e5e7eb;
      color: #111827;
    }

    .copy:disabled {
      opacity: .4;
      cursor: default;
    }

    .warning {
      margin-top: 11px;
      padding: 11px 12px;
      background: #fff8e8;
      color: #745612;
      border-radius: 10px;
      font-size: 12px;
      line-height: 1.5;
    }

    .footer {
      text-align: center;
      padding: 2px 0 25px;
      color: #9ca3af;
      font-size: 11px;
    }

    .toast {
      position: fixed;
      left: 50%;
      bottom: 25px;
      transform: translateX(-50%) translateY(15px);
      background: #111827;
      color: white;
      border-radius: 50px;
      padding: 11px 17px;
      font-size: 13px;
      opacity: 0;
      pointer-events: none;
      transition: .2s;
      z-index: 100;
    }

    .toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    @media(max-width:480px) {

      .container {
        padding: 11px;
      }

      .card {
        padding: 15px 13px;
      }

      .people {
        grid-template-columns: repeat(3, 1fr);
      }

      .person {
        font-size: 13px;
      }

    }
  </style>
</head>

<body>

<header class="top">
  <div class="top-inner">

    <div class="small-title">
      ASM FIELD TOOLS
    </div>

    <h1>ENTRY MESSAGE</h1>

    <div class="sub">
      입문 메시지
    </div>

    <div class="clock-box">
      <div class="clock-label">
        한국 시간
      </div>

      <div id="clock">
        --
      </div>
    </div>

  </div>
</header>


<main class="container">

  <!-- 지역 -->

  <section class="card">

    <div class="card-title">
      <div class="num">01</div>
      입문 지역
    </div>

    <div class="region-list">

      <button
        class="region active"
        data-region="청주">
        청주
      </button>

      <button
        class="region"
        data-region="이천">
        이천
      </button>

      <button
        class="region"
        data-region="용인">
        용인
      </button>

    </div>

  </section>


  <!-- 인원 -->

  <section class="card">

    <div class="card-title">
      <div class="num">02</div>
      입문 인원
    </div>

    <div class="description">
      함께 입문하는 인원을 선택해 주세요.
    </div>

    <div class="toolbar">

      <div class="counter">
        <strong id="count">0명</strong>
        선택
      </div>

      <button
        id="clear"
        class="clear">
        선택 해제
      </button>

    </div>

    <div
      id="people"
      class="people">
    </div>

  </section>


  <!-- 메시지 -->

  <section class="card">

    <div class="card-title">
      <div class="num">03</div>
      메시지 작성
    </div>

    <div class="description">
      생성 버튼을 누른 시각이 입력됩니다.
    </div>

    <div
      id="preview"
      class="preview placeholder">입문 인원을 선택한 뒤
메시지 생성 버튼을 눌러주세요.</div>

    <div class="actions">

      <button
        id="generate"
        class="generate">
        메시지 생성
      </button>

      <button
        id="copy"
        class="copy"
        disabled>
        메시지 복사
      </button>

    </div>

    <div class="warning">
      안전·보안 체크를 마친 뒤 생성해 주세요.<br>
      복사한 메시지는 카카오톡 등에 붙여넣으면 됩니다.
    </div>

  </section>

</main>


<div class="footer">
  ASM 입문 메시지 도우미
</div>


<div
  id="toast"
  class="toast">
</div>


<script>

  /* ===========================
     입문자 명단
  =========================== */

  const peopleList = [
    "엄재호",
    "오승준",
    "김민서",
    "김택",
    "박동준",
    "배성철",
    "서지수",
    "송영민",
    "송유진",
    "이중경",
    "정예지",
    "정희석",
    "홍성민",
    "남대웅",
    "서동현",
    "김재원",
    "남상혁",
    "김성준",
    "김민석"
  ];


  let region = "청주";
  let selected = [];
  let finalMessage = "";


  const peopleBox =
    document.getElementById("people");

  const countBox =
    document.getElementById("count");

  const preview =
    document.getElementById("preview");

  const copyButton =
    document.getElementById("copy");

  const toast =
    document.getElementById("toast");


  /* ===========================
     한국시간
  =========================== */

  function koreaDate() {

    const parts =
      new Intl.DateTimeFormat(
        "en-CA",
        {
          timeZone: "Asia/Seoul",
          year: "numeric",
          month: "2-digit",
          day: "2-digit",
          hour: "2-digit",
          minute: "2-digit",
          second: "2-digit",
          hour12: false
        }
      ).formatToParts(new Date());

    const data = {};

    parts.forEach(
      item => data[item.type] = item.value
    );

    return data;
  }


  function updateClock() {

    const t = koreaDate();

    document.getElementById("clock")
      .textContent =
      `${t.year}.${t.month}.${t.day} ` +
      `${t.hour}:${t.minute}:${t.second}`;
  }


  updateClock();

  setInterval(
    updateClock,
    1000
  );


  /* ===========================
     사람 버튼
  =========================== */

  function renderPeople() {

    peopleBox.innerHTML = "";

    peopleList.forEach(name => {

      const button =
        document.createElement("button");

      button.textContent = name;

      button.className =
        "person";

      if(selected.includes(name)) {
        button.classList.add("selected");
      }


      button.onclick = () => {

        if(selected.includes(name)) {

          selected =
            selected.filter(
              value => value !== name
            );

        }

        else {

          selected.push(name);

        }

        renderPeople();

        resetMessage();

      };


      peopleBox.appendChild(button);

    });


    countBox.textContent =
      `${selected.length}명`;

  }


  renderPeople();


  /* ===========================
     지역
  =========================== */

  document
    .querySelectorAll(".region")
    .forEach(button => {

      button.onclick = () => {

        document
          .querySelectorAll(".region")
          .forEach(
            item =>
            item.classList.remove("active")
          );

        button.classList.add("active");

        region =
          button.dataset.region;

        resetMessage();

      };

    });


  /* ===========================
     전체 선택 해제
  =========================== */

  document
    .getElementById("clear")
    .onclick = () => {

      selected = [];

      renderPeople();

      resetMessage();

    };


  /* ===========================
     메시지 초기화
  =========================== */

  function resetMessage() {

    finalMessage = "";

    preview.classList.add("placeholder");

    preview.textContent =
`입문 인원을 선택한 뒤
메시지 생성 버튼을 눌러주세요.`;

    copyButton.disabled = true;

  }


  /* ===========================
     메시지 생성
  =========================== */

  document
    .getElementById("generate")
    .onclick = () => {

      if(selected.length === 0) {

        showToast(
          "입문 인원을 선택해 주세요."
        );

        return;
      }


      const t = koreaDate();


      const time =
        `${t.hour}:${t.minute}`;


      const names =
        selected.join(", ");


      finalMessage =
`${region} ${time}
${names}
안전 및 보안 체크 완료`;


      preview.textContent =
        finalMessage;


      preview.classList
        .remove("placeholder");


      copyButton.disabled = false;


      showToast(
        "메시지가 생성되었습니다."
      );

    };


  /* ===========================
     메시지 복사
  =========================== */

  copyButton.onclick = async () => {

    if(!finalMessage) {
      return;
    }


    try {

      await navigator.clipboard
        .writeText(finalMessage);

    }

    catch {

      const textarea =
        document.createElement("textarea");

      textarea.value =
        finalMessage;

      document.body
        .appendChild(textarea);

      textarea.select();

      document.execCommand("copy");

      textarea.remove();

    }


    showToast(
      "메시지를 복사했습니다."
    );

  };


  /* ===========================
     토스트
  =========================== */

  let toastTimer;


  function showToast(text) {

    clearTimeout(toastTimer);

    toast.textContent = text;

    toast.classList.add("show");


    toastTimer =
      setTimeout(() => {

        toast.classList
          .remove("show");

      }, 1600);

  }

</script>

</body>
</html>
