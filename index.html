<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#111827">
  <title>ASM Entry Check</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Pretendard,
        "Noto Sans KR",
        Arial,
        sans-serif;
      background: #f4f6f8;
      color: #171717;
    }

    .header {
      background: #111827;
      color: white;
      padding: 22px 18px 20px;
    }

    .header-inner {
      max-width: 680px;
      margin: 0 auto;
    }

    .brand {
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 1.5px;
      opacity: 0.65;
      margin-bottom: 7px;
    }

    .title {
      font-size: 27px;
      font-weight: 800;
      margin: 0;
    }

    .subtitle {
      margin-top: 5px;
      font-size: 14px;
      color: #cbd5e1;
    }

    .live-time {
      margin-top: 17px;
      background: rgba(255,255,255,0.09);
      border: 1px solid rgba(255,255,255,0.13);
      border-radius: 12px;
      padding: 11px 13px;
    }

    .live-time-label {
      font-size: 11px;
      color: #94a3b8;
      margin-bottom: 3px;
    }

    .live-time-value {
      font-size: 17px;
      font-weight: 700;
      font-variant-numeric: tabular-nums;
    }

    .container {
      max-width: 680px;
      margin: 0 auto;
      padding: 16px;
    }

    .card {
      background: white;
      border-radius: 16px;
      padding: 18px;
      margin-bottom: 14px;
      box-shadow: 0 2px 12px rgba(0,0,0,0.055);
      border: 1px solid #e7e9ed;
    }

    .section-title {
      display: flex;
      align-items: center;
      gap: 9px;
      margin-bottom: 14px;
      font-size: 17px;
      font-weight: 800;
    }

    .number {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 27px;
      height: 27px;
      border-radius: 8px;
      background: #111827;
      color: white;
      font-size: 12px;
      font-weight: 800;
    }

    .section-desc {
      margin: -6px 0 14px 36px;
      font-size: 13px;
      color: #6b7280;
    }

    .region-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 9px;
    }

    .region-btn {
      border: 1px solid #d8dde5;
      background: white;
      border-radius: 12px;
      padding: 14px 6px;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      color: #374151;
      transition: 0.15s;
    }

    .region-btn.active {
      color: white;
      background: #111827;
      border-color: #111827;
    }

    .name-toolbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 11px;
      gap: 8px;
    }

    .count {
      font-size: 13px;
      color: #6b7280;
    }

    .count strong {
      color: #111827;
    }

    .clear-btn {
      background: #f3f4f6;
      color: #4b5563;
      border: 0;
      border-radius: 8px;
      padding: 8px 11px;
      cursor: pointer;
      font-size: 12px;
      font-weight: 700;
    }

    .name-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
    }

    .name-btn {
      position: relative;
      background: #f8fafc;
      border: 1px solid #e0e4e9;
      border-radius: 10px;
      padding: 12px 5px;
      font-size: 14px;
      font-weight: 650;
      color: #374151;
      cursor: pointer;
      transition: 0.12s;
      user-select: none;
    }

    .name-btn.active {
      color: #111827;
      background: #e5e7eb;
      border-color: #111827;
      box-shadow: inset 0 0 0 1px #111827;
    }

    .name-btn.active::after {
      content: "✓";
      position: absolute;
      top: 3px;
      right: 6px;
      font-size: 10px;
      font-weight: 900;
    }

    .preview {
      background: #f7f8fa;
      border: 1px solid #e1e5ea;
      border-radius: 12px;
      min-height: 125px;
      padding: 16px;
      white-space: pre-wrap;
      word-break: keep-all;
      font-size: 15px;
      line-height: 1.65;
      color: #374151;
    }

    .preview.empty {
      color: #9ca3af;
    }

    .button-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 9px;
      margin-top: 12px;
    }

    .generate-btn,
    .copy-btn {
      border: 0;
      border-radius: 11px;
      padding: 14px;
      font-size: 15px;
      font-weight: 800;
      cursor: pointer;
    }

    .generate-btn {
      background: #111827;
      color: white;
    }

    .copy-btn {
      background: #e5e7eb;
      color: #111827;
    }

    .copy-btn:disabled {
      opacity: 0.4;
      cursor: default;
    }

    .notice {
      margin-top: 12px;
      padding: 11px 12px;
      border-radius: 10px;
      background: #fff8e8;
      color: #7c5c13;
      font-size: 12px;
      line-height: 1.5;
    }

    .footer {
      text-align: center;
      color: #9ca3af;
      font-size: 11px;
      padding: 5px 10px 28px;
    }

    .toast {
      position: fixed;
      left: 50%;
      bottom: 28px;
      transform: translateX(-50%) translateY(15px);
      background: #111827;
      color: white;
      font-size: 13px;
      padding: 11px 17px;
      border-radius: 999px;
      opacity: 0;
      pointer-events: none;
      transition: .25s;
      z-index: 999;
      white-space: nowrap;
      box-shadow: 0 7px 25px rgba(0,0,0,0.25);
    }

    .toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    @media (max-width: 480px) {
      .container {
        padding: 12px;
      }

      .header {
        padding: 20px 15px 18px;
      }

      .title {
        font-size: 24px;
      }

      .card {
        padding: 16px 14px;
      }

      .name-grid {
        grid-template-columns: repeat(3, 1fr);
      }

      .name-btn {
        font-size: 13px;
        padding: 11px 3px;
      }
    }
  </style>
</head>

<body>

<header class="header">
  <div class="header-inner">
    <div class="brand">ASM FIELD TOOLS</div>
    <h1 class="title">ENTRY MESSAGE</h1>
    <div class="subtitle">입문 보고, 간편하게.</div>

    <div class="live-time">
      <div class="live-time-label">한국 현재 시간</div>
      <div id="liveTime" class="live-time-value">--</div>
    </div>
  </div>
</header>

<main class="container">

  <!-- 지역 -->
  <section class="card">
    <div class="section-title">
      <span class="number">01</span>
      입문 지역
    </div>

    <div class="region-grid">
      <button class="region-btn active" data-region="청주">청주</button>
      <button class="region-btn" data-region="이천">이천</button>
      <button class="region-btn" data-region="용인">용인</button>
    </div>
  </section>


  <!-- 이름 -->
  <section class="card">
    <div class="section-title">
      <span class="number">02</span>
      입문 인원
    </div>

    <div class="section-desc">
      함께 입문하는 인원을 모두 선택하세요.
    </div>

    <div class="name-toolbar">
      <div class="count">
        선택 <strong id="selectedCount">0명</strong>
      </div>

      <button id="clearBtn" class="clear-btn">
        선택 해제
      </button>
    </div>

    <div id="nameGrid" class="name-grid"></div>
  </section>


  <!-- 메시지 -->
  <section class="card">
    <div class="section-title">
      <span class="number">03</span>
      입문 메시지
    </div>

    <div class="section-desc">
      생성 버튼을 누른 시각이 메시지에 입력됩니다.
    </div>

    <div id="preview" class="preview empty">
지역과 입문자를 선택한 뒤
메시지 생성 버튼을 눌러주세요.
    </div>

    <div class="button-row">
      <button id="generateBtn" class="generate-btn">
        메시지 생성
      </button>

      <button id="copyBtn" class="copy-btn" disabled>
        메시지 복사
      </button>
    </div>

    <div class="notice">
      실제 안전·보안 체크를 완료한 뒤 메시지를 생성해 주세요.
    </div>
  </section>

</main>

<div class="footer">
  ASM Entry Message Helper
</div>

<div id="toast" class="toast">
  메시지를 복사했습니다.
</div>


<script>
  // =============================
  // 입문자 명단
  // =============================

  const people = [
    "엄재호",
    "오승준",
    "김민서",
    "김택",
    "박동준",
    "배성철",
    "서지수",
    "송영민",
    "송유진",
    "이중경",
    "정예지",
    "정희석",
    "홍성민",
    "남대웅",
    "서동현",
    "김재원",
    "남상혁",
    "김성준",
    "김민석"
  ];


  // =============================
  // 상태
  // =============================

  let selectedRegion = "청주";
  let selectedPeople = [];
  let generatedMessage = "";


  // =============================
  // 요소
  // =============================

  const liveTimeEl = document.getElementById("liveTime");
  const nameGridEl = document.getElementById("nameGrid");
  const selectedCountEl = document.getElementById("selectedCount");
  const previewEl = document.getElementById("preview");
  const copyBtn = document.getElementById("copyBtn");
  const generateBtn = document.getElementById("generateBtn");
  const clearBtn = document.getElementById("clearBtn");
  const toastEl = document.getElementById("toast");


  // =============================
  // 한국 시간
  // =============================

  function getKoreaDate() {
    const now = new Date();

    const koreaString = now.toLocaleString("en-US", {
      timeZone: "Asia/Seoul"
    });

    return new Date(koreaString);
  }


  function pad(value) {
    return String(value).padStart(2, "0");
  }


  function formatClock(date) {
    const year = date.getFullYear();
    const month = pad(date.getMonth() + 1);
    const day = pad(date.getDate());
    const hour = pad(date.getHours());
    const minute = pad(date.getMinutes());
    const second = pad(date.getSeconds());

    return `${year}.${month}.${day} ${hour}:${minute}:${second}`;
  }


  function formatMessageTime(date) {
    const year = date.getFullYear();
    const month = pad(date.getMonth() + 1);
    const day = pad(date.getDate());
    const hour = pad(date.getHours());
    const minute = pad(date.getMinutes());

    return `${year}.${month}.${day} ${hour}:${minute}`;
  }


  function updateLiveTime() {
    liveTimeEl.textContent = formatClock(getKoreaDate());
  }


  updateLiveTime();
  setInterval(updateLiveTime, 1000);


  // =============================
  // 지역 선택
  // =============================

  document.querySelectorAll(".region-btn").forEach(button => {
    button.addEventListener("click", () => {

      document.querySelectorAll(".region-btn")
        .forEach(btn => btn.classList.remove("active"));

      button.classList.add("active");

      selectedRegion = button.dataset.region;

      // 선택을 바꾸면 기존 메시지는 무효화
      resetGeneratedMessage();
    });
  });


  // =============================
  // 이름 버튼 만들기
  // =============================

  function renderPeople() {

    nameGridEl.innerHTML = "";

    people.forEach(name => {

      const button = document.createElement("button");

      button.className = "name-btn";
      button.textContent = name;

      if (selectedPeople.includes(name)) {
        button.classList.add("active");
      }

      button.addEventListener("click", () => {

        if (selectedPeople.includes(name)) {

          selectedPeople =
            selectedPeople.filter(person => person !== name);

        } else {

          selectedPeople.push(name);

        }

        renderPeople();
        updateCount();
        resetGeneratedMessage();
      });

      nameGridEl.appendChild(button);
    });
  }


  function updateCount() {
    selectedCountEl.textContent = `${selectedPeople.length}명`;
  }


  renderPeople();
  updateCount();


  // =============================
  // 선택 초기화
  // =============================

  clearBtn.addEventListener("click", () => {

    selectedPeople = [];

    renderPeople();
    updateCount();
    resetGeneratedMessage();

  });


  function resetGeneratedMessage() {

    generatedMessage = "";

    previewEl.classList.add("empty");

    previewEl.textContent =
`지역과 입문자를 선택한 뒤
메시지 생성 버튼을 눌러주세요.`;

    copyBtn.disabled = true;
  }


  // =============================
  // 메시지 생성
  // =============================

  generateBtn.addEventListener("click", () => {

    if (selectedPeople.length === 0) {
      showToast("입문자를 선택해 주세요.");
      return;
    }

    const koreaNow = getKoreaDate();
    const time = formatMessageTime(koreaNow);

    const names = selectedPeople.join(", ");

    /*
      ↓↓↓ 메시지 모양을 바꾸고 싶으면
      이 부분만 수정하면 됩니다.
    */

    generatedMessage =
`[${selectedRegion} 입문]
시간 : ${time}
입문자 : ${names}
안전·보안 체크 완료`;

    previewEl.textContent = generatedMessage;
    previewEl.classList.remove("empty");

    copyBtn.disabled = false;

    showToast("입문 메시지를 생성했습니다.");
  });


  // =============================
  // 복사
  // =============================

  copyBtn.addEventListener("click", async () => {

    if (!generatedMessage) return;

    try {

      await navigator.clipboard.writeText(generatedMessage);

      showToast("메시지를 복사했습니다.");

    } catch (error) {

      // 일부 모바일 브라우저용 예비 복사 방식
      const textarea = document.createElement("textarea");

      textarea.value = generatedMessage;
      textarea.style.position = "fixed";
      textarea.style.opacity = "0";

      document.body.appendChild(textarea);

      textarea.select();

      document.execCommand("copy");

      document.body.removeChild(textarea);

      showToast("메시지를 복사했습니다.");
    }

  });


  // =============================
  // 안내 토스트
  // =============================

  let toastTimer;

  function showToast(message) {

    clearTimeout(toastTimer);

    toastEl.textContent = message;
    toastEl.classList.add("show");

    toastTimer = setTimeout(() => {
      toastEl.classList.remove("show");
    }, 1700);

  }
</script>

</body>
</html>
